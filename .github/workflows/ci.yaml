name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test, lint and build snapshot
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build snapshot binary
        run: cargo build --release --locked

      - name: Run smoke regression suite
        env:
          GALEN_BIN: target/release/galen
          GALEN_REGRESSION_MODE: smoke
        run: cargo test --locked --test regression -- --ignored --nocapture

      - name: Prepare snapshot artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA::12}"
          cp target/release/galen "dist/galen-linux-x86_64-snapshot-${SHORT_SHA}"
          sha256sum "dist/galen-linux-x86_64-snapshot-${SHORT_SHA}" > dist/checksums.txt

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v7
        with:
          name: galen-snapshot-${{ github.sha }}
          path: |
            dist/galen-linux-x86_64-snapshot-*
            dist/checksums.txt

  mutation-shard:
    name: Mutation tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # cargo-mutants numbers shards from zero.
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 25.0.0 --locked

      - name: Run mutation tests
        env:
          YRX_REGENERATE_MODULES_RS: "false"
        run: |
          set +e
          cargo mutants --timeout 25 --shard "${{ matrix.shard }}/4"
          MUTANTS_EXIT=$?
          set -e

          if [[ ! -f mutants.out/outcomes.json ]]; then
            echo "cargo-mutants exited with ${MUTANTS_EXIT} without producing outcomes.json"
            exit 1
          fi

      - name: Upload mutation shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-results-${{ github.sha }}-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: warn

  mutation:
    name: Mutation score ratchet
    needs: mutation-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Download mutation shard results
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-results-${{ github.sha }}-*
          path: mutation-shards

      - name: Aggregate and enforce mutation score ratchet
        run: |
          mapfile -t OUTCOMES < <(find mutation-shards -name outcomes.json -type f | sort)
          if [[ "${#OUTCOMES[@]}" -ne 4 ]]; then
            echo "Expected 4 mutation shard reports, found ${#OUTCOMES[@]}"
            exit 1
          fi
          python3 scripts/check-mutation-score.py \
            --output mutants.out/outcomes.json \
            "${OUTCOMES[@]}"

      - name: Upload combined mutation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-results-${{ github.sha }}
          path: mutants.out/
          if-no-files-found: warn

  coverage:
    name: Unit-test coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --version 0.31.5 --locked

      - name: Enforce unit-test coverage ratchet
        env:
          CCACHE_DISABLE: "1"
          YRX_REGENERATE_MODULES_RS: "false"
        run: |
          mkdir -p coverage
          set -o pipefail
          cargo tarpaulin \
            --locked \
            --engine Ptrace \
            --fail-under 81.5 \
            --out Html Json \
            --output-dir coverage \
            2>&1 | tee coverage/tarpaulin.log

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
