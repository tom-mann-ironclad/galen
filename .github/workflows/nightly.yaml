name: Update Nightly Package Repositories

on:
  schedule:
    # Runs at 00:00 UTC every day (Midnight)
    - cron: '0 0 * * *'
  workflow_dispatch: # Keeps the "Run workflow" button in GitHub UI for manual testing

# Concurrency is still useful here in case a manual run overlaps with the scheduled run
concurrency:
  group: nightly-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality metrics
    uses: ./.github/workflows/ci.yaml

  regression:
    name: Full regression
    uses: ./.github/workflows/regression.yaml

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_zip, fuzz_tar, fuzz_gzip]

    env:
      CARGO_FUZZ_VERSION: 0.13.2

    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          cache-on-failure: true

      - name: Cache cargo-fuzz
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.CARGO_FUZZ_VERSION }}

      - name: Install cargo-fuzz
        run: |
          echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> "$GITHUB_PATH"
          if [[ ! -x "${{ runner.tool_cache }}/cargo-fuzz/bin/cargo-fuzz" ]]; then
            cargo install \
              --root "${{ runner.tool_cache }}/cargo-fuzz" \
              --version "$CARGO_FUZZ_VERSION" \
              cargo-fuzz \
              --locked
          fi

      - name: Run ${{ matrix.target }} for five minutes
        id: fuzz
        run: |
          set -o pipefail
          mkdir -p fuzz-results
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time=300 \
            -max_len=1048576 \
            -timeout=10 \
            -rss_limit_mb=2048 \
            2>&1 | tee "fuzz-results/${{ matrix.target }}.log"

      - name: Summarise fuzz result
        if: always()
        run: |
          if [[ "${{ steps.fuzz.outcome }}" == "failure" ]]; then
            {
              echo "::warning::${{ matrix.target }} found a crash or failed to complete"
              echo "### ${{ matrix.target }} requires investigation"
              echo '```sh'
              echo "cargo +nightly fuzz run ${{ matrix.target }} fuzz/artifacts/${{ matrix.target }}/<artifact>"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.target }} completed its five-minute run" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-results-${{ matrix.target }}-${{ github.sha }}
          path: |
            fuzz-results/${{ matrix.target }}.log
            fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn

  benchmark-clamav:
    name: Benchmark against ClamAV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Observability only: report results, do not fail the nightly build.
    # GitHub-hosted runners are shared and noisy enough that hard-gating on
    # wall-clock time before a stable baseline exists would be a source of
    # false alarms rather than signal. Revisit once a few weeks of nightly
    # results establish normal run-to-run variance.
    continue-on-error: true

    # Pinned YARA Forge release fed into `galen update --yara-dir` (or the
    # compile_yara_cache fallback below) to give Galen a representative
    # ruleset. Bump alongside corpus-manifest.txt when deliberately
    # refreshing the benchmark baseline.
    env:
      YARA_FORGE_TAG: "20260823"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Build release binary and benchmark tooling
        run: |
          cargo build --release --locked
          cargo build --release --locked --example compile_yara_cache

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clamav clamav-freshclam sqlite3 time unzip

      - name: Determine cache date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Cache ClamAV signature database
        uses: actions/cache@v5
        with:
          path: /var/lib/clamav
          key: clamav-db-${{ steps.date.outputs.date }}
          restore-keys: |
            clamav-db-

      - name: Update ClamAV signatures
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam || echo "::warning::freshclam failed; benchmarking against whatever database is available"

      # Without this, every nightly run starts from a clean checkout and
      # `galen update` treats the missing database as a first run, doing a
      # full Malware Bazaar bootstrap download instead of an incremental
      # fetch. Only matters once MALWARE_BAZAAR_AUTH_KEY is set; harmless
      # no-op otherwise.
      - name: Cache Malware Bazaar signature database
        uses: actions/cache@v5
        with:
          path: signature_database.sqlite
          key: malware-bazaar-db-${{ steps.date.outputs.date }}
          restore-keys: |
            malware-bazaar-db-

      - name: Prepare benchmark corpus
        run: scripts/bench/prepare-corpus.sh bench-corpus

      - name: Fetch pinned YARA Forge core ruleset
        run: |
          mkdir -p yara
          curl -sSL -o /tmp/yara-forge-core.zip \
            "https://github.com/YARAHQ/yara-forge/releases/download/${YARA_FORGE_TAG}/yara-forge-rules-core.zip"
          unzip -q -o /tmp/yara-forge-core.zip -d yara/

      # Best-effort: try a real update when the secret is available, then
      # fall back for whichever artifact is still missing afterward. A
      # failed `galen update` (bad/rate-limited key, network hiccup) is
      # reported but not fatal - if a cached database from a previous run
      # is still on disk, we benchmark with that rather than losing the
      # whole night's run.
      - name: Update signatures and compile YARA rules
        env:
          GALEN_AUTH_KEY: ${{ secrets.MALWARE_BAZAAR_AUTH_KEY }}
        run: |
          if [[ -n "${GALEN_AUTH_KEY:-}" ]]; then
            echo "MALWARE_BAZAAR_AUTH_KEY is set: running galen update for a real signature database"
            target/release/galen update \
              --database signature_database.sqlite \
              --yara-dir yara/ \
              --yara-cache yara/compiled/galen.yaraxc \
              || echo "::warning::galen update failed; benchmarking with whatever database and rules cache resulted"
          else
            echo "::warning::MALWARE_BAZAAR_AUTH_KEY not set; benchmarking with an empty signature database"
          fi

          if [[ ! -f signature_database.sqlite ]]; then
            sqlite3 signature_database.sqlite "CREATE TABLE malware_hashes (sha256 BLOB);"
          fi

          if [[ ! -f yara/compiled/galen.yaraxc ]]; then
            target/release/examples/compile_yara_cache yara/ yara/compiled/galen.yaraxc
          fi

      - name: Run benchmark
        run: |
          scripts/bench/run-benchmark.sh \
            --galen-bin target/release/galen \
            --database signature_database.sqlite \
            --yara-cache yara/compiled/galen.yaraxc \
            --corpus bench-corpus \
            --out-dir bench-results

      - name: Publish benchmark summary
        if: always()
        run: |
          if [[ -f bench-results/benchmark-summary.md ]]; then
            {
              echo "### ClamAV benchmark"
              cat bench-results/benchmark-summary.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clamav-benchmark-${{ github.sha }}
          path: bench-results/
          if-no-files-found: warn

  live-sample-testing:
    name: Live sample testing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Observability only, for now: a missed detection or a scan failure on a
    # real live sample is a more meaningful signal than the ClamAV
    # benchmark's timing numbers, but Malware Bazaar availability and its
    # fair-use limits can still cause external flakes unrelated to galen.
    # Revisit once a detection-rate baseline exists (see TODO.md: "Live
    # sample testing in CI").
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Install job dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq unzip clamav clamav-freshclam

      - name: Build release binary and YARA compiler
        run: |
          cargo build --release --locked
          cargo build --release --locked --example compile_yara_cache

      - name: Determine cache date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Shares a cache key with benchmark-clamav's signature database so a
      # warm database (and therefore `galen update`'s incremental "recent"
      # path rather than a full bootstrap) is available whenever either job
      # has already run today. See update_signatures_with_client in
      # src/updater/update_signatures.rs: an empty database always
      # bootstraps from Malware Bazaar's full export, which can lag behind
      # the very latest samples this job just downloaded.
      - name: Cache Malware Bazaar signature database
        uses: actions/cache@v5
        with:
          path: signature_database.sqlite
          key: malware-bazaar-db-${{ steps.date.outputs.date }}
          restore-keys: |
            malware-bazaar-db-

      # Comparison point only (see check-verdicts.sh and README.md
      # "Benchmarks"): how many of the same live samples ClamAV's own
      # signatures catch, never a pass/fail gate for this job.
      - name: Cache ClamAV signature database
        uses: actions/cache@v5
        with:
          path: /var/lib/clamav
          key: clamav-db-${{ steps.date.outputs.date }}
          restore-keys: |
            clamav-db-

      - name: Update ClamAV signatures
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam || echo "::warning::freshclam failed; comparing against whatever ClamAV database is available"

      - name: Compile local YARA rules
        run: target/release/examples/compile_yara_cache yara/ yara/compiled/galen.yaraxc

      - name: Fetch live malware samples
        id: fetch
        env:
          GALEN_AUTH_KEY: ${{ secrets.MALWARE_BAZAAR_AUTH_KEY }}
        run: |
          if [[ -z "${GALEN_AUTH_KEY:-}" ]]; then
            echo "::warning::MALWARE_BAZAAR_AUTH_KEY not set; skipping live sample testing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/live-samples/fetch-live-samples.sh \
            --out-dir "$RUNNER_TEMP/live-samples" \
            --count 15

      - name: Update signature database
        if: steps.fetch.outputs.skip != 'true'
        env:
          GALEN_AUTH_KEY: ${{ secrets.MALWARE_BAZAAR_AUTH_KEY }}
        run: |
          target/release/galen update \
            --database signature_database.sqlite \
            --yara-dir yara/ \
            --yara-cache yara/compiled/galen.yaraxc

      - name: Scan live samples
        if: steps.fetch.outputs.skip != 'true'
        run: |
          target/release/galen scan "$RUNNER_TEMP/live-samples/samples" \
            --database signature_database.sqlite \
            --yara-cache yara/compiled/galen.yaraxc \
            --output json \
            > "$RUNNER_TEMP/live-samples/scan.json" || true

      - name: Scan live samples with ClamAV
        if: steps.fetch.outputs.skip != 'true'
        run: |
          clamscan --recursive --no-summary "$RUNNER_TEMP/live-samples/samples" \
            > "$RUNNER_TEMP/live-samples/clamav.log" || true

      - name: Check verdicts
        if: steps.fetch.outputs.skip != 'true'
        run: |
          scripts/live-samples/check-verdicts.sh \
            --manifest "$RUNNER_TEMP/live-samples/manifest.json" \
            --scan-json "$RUNNER_TEMP/live-samples/scan.json" \
            --clamav-log "$RUNNER_TEMP/live-samples/clamav.log" \
            --out-dir live-sample-results

      - name: Publish summary
        if: always() && steps.fetch.outputs.skip != 'true'
        run: |
          if [[ -f live-sample-results/live-sample-summary.md ]]; then
            cat live-sample-results/live-sample-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verdict report
        if: always() && steps.fetch.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: live-sample-results-${{ github.sha }}
          path: live-sample-results/
          if-no-files-found: warn

      # Raw live samples never leave $RUNNER_TEMP (not the working tree, not
      # an artifact) but are removed explicitly rather than left for the
      # runner teardown, since this step also runs on failure.
      - name: Remove downloaded samples
        if: always()
        run: rm -rf "$RUNNER_TEMP/live-samples"

  deploy-nightly:
    needs: [regression, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Repo Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c
          cargo install cargo-deb cargo-generate-rpm

      - name: Download mutation report
        uses: actions/download-artifact@v7
        with:
          name: mutation-results-${{ github.sha }}
          path: quality-results/mutation

      - name: Download coverage report
        uses: actions/download-artifact@v7
        with:
          name: unit-test-coverage-${{ github.sha }}
          path: quality-results/coverage

      - name: Import GPG Key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Generate unique pre-release version string using current UTC date
      - name: Build Nightly Packages
        run: |
          mkdir -p dist/apt dist/dnf
          
          # Generate nightly versions for Cargo and distro package managers.
          BASE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          NIGHTLY_DATE="$(date -u +%Y%m%d)"
          CARGO_NIGHTLY_VERSION="${BASE_VERSION}+nightly.${NIGHTLY_DATE}"
          PACKAGE_NIGHTLY_VERSION="${BASE_VERSION}~nightly.${NIGHTLY_DATE}"
          echo "Injecting Cargo Nightly Version: $CARGO_NIGHTLY_VERSION"
          echo "Injecting Package Nightly Version: $PACKAGE_NIGHTLY_VERSION"
          
          # Update Cargo.toml inline before compiling
          sed -i "0,/version = \".*\"/{s/version = \".*\"/version = \"$CARGO_NIGHTLY_VERSION\"/}" Cargo.toml
          
          # 1. Compile production binary
          cargo build --release
          
          # 2. Strip debug symbols to dramatically minimize binary size
          strip -s target/release/galen
          
          # 3. Generate the Debian package (.deb)
          cargo deb --no-build --deb-version "${PACKAGE_NIGHTLY_VERSION}-1" -o dist/apt/
          
          # 4. Generate the RedHat package (.rpm)
          RPM_METADATA="$(mktemp)"
          printf 'version = "%s"\nrelease = "1"\n' "$PACKAGE_NIGHTLY_VERSION" > "$RPM_METADATA"
          cargo generate-rpm -o dist/dnf/ --metadata-overwrite="$RPM_METADATA"

      - name: Generate APT Repo Metadata
        run: |
          cd dist/apt
          dpkg-scanpackages . /dev/null > Packages
          gzip -9fk Packages
          apt-ftparchive release . > Release
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --passphrase-fd 0 --clearsign --local-user "${{ steps.import-gpg.outputs.keyid }}" -o InRelease Release
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --passphrase-fd 0 --detach-sign --local-user "${{ steps.import-gpg.outputs.keyid }}" -o Release.gpg Release

      - name: Generate DNF Repo Metadata
        run: |
          cd dist/dnf
          createrepo_c .
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --passphrase-fd 0 --detach-sign --local-user "${{ steps.import-gpg.outputs.keyid }}" --armor repodata/repomd.xml

      - name: Generate dynamic badge data
        run: |
          python3 scripts/generate-quality-badges.py \
            --mutation quality-results/mutation/outcomes.json \
            --coverage-log quality-results/coverage/tarpaulin.log \
            --output dist/badges

      # Sync to the 'nightly/' path. Note the '--delete' flag on both passes 
      # to ensure yesterday's packages are dropped.
      - name: Sync Nightly to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET_NAME: galen-packages
        run: |
          # Step A: Sync immutable binaries (deletes historical nightlies)
          aws s3 sync dist/ s3://$BUCKET_NAME/nightly/ \
            --endpoint-url $R2_ENDPOINT \
            --exclude "*" \
            --include "*.deb" \
            --include "*.rpm" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

          # Step B: Sync volatile metadata (forces no-cache)
          aws s3 sync dist/ s3://$BUCKET_NAME/nightly/ \
            --endpoint-url $R2_ENDPOINT \
            --exclude "*.deb" \
            --exclude "*.rpm" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete
